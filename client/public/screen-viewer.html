<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnBoard - Màn Hình Chia Sẻ Trực Tiếp</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #060a08;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        height: 48px;
        background: #0f1914;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        flex-shrink: 0;
      }
      .title-box {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #34d399;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 10px #10b981;
        animation: pulse 1.5s infinite;
      }
      .dot.waiting {
        background: #f59e0b;
        box-shadow: 0 0 10px #f59e0b;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .status-badge {
        font-size: 11px;
        color: #94a3b8;
        padding: 4px 10px;
        background: rgba(255,255,255,0.05);
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.1);
      }
      button {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .btn-primary {
        background: #059669;
        border-color: #10b981;
      }
      .btn-primary:hover {
        background: #10b981;
      }
      .screen-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        position: relative;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .placeholder {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        color: #94a3b8;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.8);
        padding: 32px 40px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.08);
        text-align: center;
        max-width: 420px;
      }
      .placeholder h2 {
        color: #f59e0b;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .placeholder p {
        font-size: 12px;
        color: #64748b;
        line-height: 1.6;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title-box">
        <span class="dot waiting" id="statusDot"></span>
        <span id="screenTitle">Đang kết nối màn hình chia sẻ...</span>
      </div>
      <div class="actions">
        <span class="status-badge" id="statusBadge">Đang chờ stream...</span>
        <button id="unmuteBtn" onclick="toggleAudio()">🔊 Bật Âm Thanh</button>
        <button class="btn-primary" onclick="toggleFullscreen()">⛶ Toàn Màn Hình</button>
        <button onclick="window.close()">Đóng Cửa Sổ</button>
      </div>
    </header>

    <div class="screen-container">
      <video id="screenVideo" autoplay playsinline muted></video>
      <div id="placeholder" class="placeholder">
        <div class="spinner"></div>
        <h2>Đang chờ màn hình chia sẻ...</h2>
        <p>
          Cửa sổ này sẽ tự động hiển thị màn hình khi kết nối WebRTC được thiết lập.<br>
          Nếu chờ quá lâu, hãy bấm nút bên dưới hoặc nhấn vào bất kỳ đâu trong cửa sổ.
        </p>
        <button class="btn-primary" onclick="tryAttach(true)">▶️ Tải Lại / Bật Màn Hình</button>
      </div>
    </div>

    <script>
      let isAudioMuted = true;
      let attached = false;
      let lastStreamId = null;
      let retryCount = 0;
      const MAX_RETRIES = 150; // 150 * 400ms = 60 seconds timeout

      function toggleAudio() {
        const v = document.getElementById('screenVideo');
        isAudioMuted = !isAudioMuted;
        v.muted = isAudioMuted;
        document.getElementById('unmuteBtn').textContent = isAudioMuted ? '🔊 Bật Âm Thanh' : '🔇 Tắt Âm Thanh';
      }

      function toggleFullscreen() {
        const v = document.getElementById('screenVideo');
        if (!document.fullscreenElement) {
          if (v.requestFullscreen) v.requestFullscreen();
          else if (v.webkitRequestFullscreen) v.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      }

      function setStatus(text, color) {
        document.getElementById('statusBadge').textContent = text;
        const dot = document.getElementById('statusDot');
        dot.style.background = color;
        dot.style.boxShadow = `0 0 10px ${color}`;
      }

      function tryAttach(forced = false) {
        try {
          if (!window.opener) {
            setStatus('Lỗi: Không có cửa sổ mẹ', '#ef4444');
            return false;
          }

          if (typeof window.opener.getScreenStreamForPopout !== 'function') {
            setStatus('Đang chờ app tải...', '#f59e0b');
            return false;
          }

          const streamInfo = window.opener.getScreenStreamForPopout();

          if (!streamInfo || !streamInfo.stream) {
            setStatus('Chưa có stream chia sẻ', '#f59e0b');
            return false;
          }

          const stream = streamInfo.stream;
          const streamId = stream.id;

          // Check if stream has active tracks
          const videoTracks = stream.getVideoTracks();
          if (videoTracks.length === 0) {
            setStatus('Stream không có video track', '#f59e0b');
            return false;
          }

          // Pick the active, unmuted video track or the latest added video track
          const videoTrack = videoTracks.find((t) => t.readyState === 'live' && !t.muted) || videoTracks[videoTracks.length - 1];
          if (!videoTrack || videoTrack.readyState === 'ended') {
            setStatus('Stream đã kết thúc', '#ef4444');
            attached = false;
            lastStreamId = null;
            return false;
          }

          videoTrack.onunmute = () => {
            const v = document.getElementById('screenVideo');
            if (v && v.paused) v.play().catch(() => {});
          };

          const videoEl = document.getElementById('screenVideo');
          const placeholderEl = document.getElementById('placeholder');

          videoEl.onloadedmetadata = () => {
            if (videoEl.paused) videoEl.play().catch(() => {});
          };

          videoEl.onplaying = () => {
            placeholderEl.style.display = 'none';
            const name = streamInfo.userName || 'Đối tác';
            document.getElementById('screenTitle').textContent = 'Màn hình: ' + name;
            setStatus('✅ Đang phát trực tiếp', '#10b981');
            const dot = document.getElementById('statusDot');
            dot.classList.remove('waiting');
            attached = true;
          };

          // Attach only if new stream or forced
          if (videoEl.srcObject !== stream || forced) {
            videoEl.srcObject = stream;
            lastStreamId = streamId;
          }

          videoEl.muted = isAudioMuted;

          if (videoEl.paused) {
            videoEl.play().catch((err) => {
              videoEl.muted = true;
              videoEl.play().catch(() => {});
            });
          }

          return true;
        } catch (err) {
          console.warn('Error in tryAttach:', err);
          setStatus('Lỗi: ' + err.message, '#ef4444');
          return false;
        }
      }

      // Continuous polling loop - checks every 400ms indefinitely so connection is NEVER lost
      window.addEventListener('load', () => {
        setInterval(() => {
          const videoEl = document.getElementById('screenVideo');

          // If video element is already rendering frames, keep active
          if (videoEl && videoEl.videoWidth > 0 && !videoEl.paused) {
            document.getElementById('placeholder').style.display = 'none';
            setStatus('✅ Đang phát trực tiếp', '#10b981');
            attached = true;
            return;
          }

          tryAttach();

          if (attached && videoEl.srcObject) {
            const tracks = videoEl.srcObject.getVideoTracks();
            if (tracks.length === 0 || tracks[0].readyState === 'ended') {
              attached = false;
              document.getElementById('placeholder').style.display = 'flex';
              setStatus('Đang chờ lại...', '#f59e0b');
            }
          }
        }, 400);
      });

      // Click anywhere to force retry (helps with autoplay restrictions)
      document.body.addEventListener('click', () => {
        tryAttach(true);
      });
    </script>
  </body>
</html>
